<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"
     shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Clip everything to the inner disc so nothing bleeds outside the border ring -->
    <clipPath id="dc">
      <circle cx="100" cy="100" r="94"/>
    </clipPath>
    <!-- Radial glow behind eagle -->
    <radialGradient id="glow" cx="53%" cy="30%" r="28%">
      <stop offset="0%"  stop-color="#22c55e" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── Background disc ──────────────────────────────────────────────── -->
  <circle cx="100" cy="100" r="100" fill="#060d1b"/>

  <!-- ── All artwork clipped to inner disc ───────────────────────────── -->
  <g clip-path="url(#dc)">

    <!-- Subtle radial glow near eagle -->
    <circle cx="100" cy="100" r="100" fill="url(#glow)"/>

    <!-- ── Mountain range ─────────────────────────────────────────────── -->
    <!-- Silhouette fill — dark greenish-black -->
    <path d="M -2 156
             L 22 130 L 40 142
             L 58 110 L 76 124
             L 88 100 L 95 107
             L 100 86
             L 105 107 L 112 100
             L 124 124 L 142 110
             L 160 142 L 178 130
             L 202 156 Z"
          fill="#081610"/>

    <!-- Mountain ridge outline — bright green -->
    <path d="M -2 156
             L 22 130 L 40 142
             L 58 110 L 76 124
             L 88 100 L 95 107
             L 100 86
             L 105 107 L 112 100
             L 124 124 L 142 110
             L 160 142 L 178 130
             L 202 156"
          fill="none" stroke="#22c55e" stroke-width="2.6"
          stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Snow — centre peak -->
    <path d="M 100 86 L 113 112 L 87 112 Z"
          fill="rgba(240,249,255,0.72)"/>
    <!-- Snow — left secondary -->
    <path d="M 58 110 L 65 123 L 51 123 Z"
          fill="rgba(240,249,255,0.38)"/>
    <!-- Snow — right secondary -->
    <path d="M 142 110 L 149 123 L 135 123 Z"
          fill="rgba(240,249,255,0.38)"/>

    <!-- ── Raven (Celtic bird of wisdom and prophecy) ───────────────── -->
    <!-- Left wing — broad, slightly fingered, sweeping back -->
    <path d="M 91 50
             C 80 43 63 34 48 30
             C 40 28 37 33 43 40
             C 55 37 73 44 89 54
             Z"
          fill="#f0fdf4"/>
    <!-- Right wing (mirror) -->
    <path d="M 109 50
             C 120 43 137 34 152 30
             C 160 28 163 33 157 40
             C 145 37 127 44 111 54
             Z"
          fill="#f0fdf4"/>
    <!-- Body -->
    <ellipse cx="100" cy="52" rx="11" ry="7" fill="#f0fdf4"/>
    <!-- Head — centred, upright -->
    <circle cx="100" cy="40" r="8" fill="#f0fdf4"/>
    <!-- Beak — hooked down, raven characteristic -->
    <path d="M 104 38 C 113 36 115 41 111 44 L 104 41 Z" fill="#060d1b"/>
    <!-- Eye — bright, intelligent -->
    <circle cx="103" cy="37" r="2" fill="#060d1b"/>
    <circle cx="102.4" cy="36.4" r="0.7" fill="#f0fdf4"/>
    <!-- Tail — wedge-shaped (raven's distinctive diamond tail) -->
    <path d="M 93 57
             L 89 71 L 94 67 L 100 74
             L 106 67 L 111 71 L 107 57 Z"
          fill="#f0fdf4"/>

    <!-- ── Three stars (Douglas mullets) ─────────────────────────────── -->
    <g fill="#22c55e" opacity="0.95">
      <!-- Left star, centre (38, 73) -->
      <polygon points="38,66 39.8,71.5 45.5,71.5 41,75 42.8,80.5
                        38,77 33.2,80.5 35,75 30.5,71.5 36.2,71.5"/>
      <!-- Centre star, centre (100, 71) -->
      <polygon points="100,64 101.8,69.5 107.5,69.5 103,73 104.8,78.5
                        100,75 95.2,78.5 97,73 92.5,69.5 98.2,69.5"/>
      <!-- Right star, centre (162, 73) -->
      <polygon points="162,66 163.8,71.5 169.5,71.5 165,75 166.8,80.5
                        162,77 157.2,80.5 159,75 154.5,71.5 160.2,71.5"/>
    </g>

  </g><!-- end clip -->

  <!-- ── Border rings (drawn on top so they're always crisp) ─────────── -->
  <circle cx="100" cy="100" r="95.5" fill="none" stroke="#16a34a" stroke-width="4.5"/>
  <circle cx="100" cy="100" r="86"   fill="none" stroke="rgba(34,197,94,0.18)" stroke-width="1.2"/>

  <!-- ── Decorative bottom arc ────────────────────────────────────────── -->
  <path d="M 30 162 A 74 74 0 0 0 170 162"
        fill="none" stroke="rgba(34,197,94,0.30)" stroke-width="1.4"/>

  <!-- ── SLIABH wordmark ───────────────────────────────────────────────── -->
  <text x="100" y="178"
        text-anchor="middle"
        font-family="'Georgia', 'Times New Roman', serif"
        font-size="20" font-weight="700"
        fill="#22c55e" letter-spacing="5">SLIABH</text>
</svg>
