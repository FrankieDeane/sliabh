<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <!-- Background disc -->
  <circle cx="100" cy="100" r="98" fill="#060d1b"/>

  <!-- Outer rings -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#16a34a" stroke-width="3.5"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="rgba(34,197,94,0.22)" stroke-width="1.2"/>

  <!-- Mountain silhouette fill -->
  <path d="M10 150 L38 90 L58 112 L100 52 L142 112 L162 90 L190 150 Z"
        fill="#0a1e12"/>

  <!-- Mountain outline -->
  <path d="M10 150 L38 90 L58 112 L100 52 L142 112 L162 90 L190 150"
        fill="none" stroke="#22c55e" stroke-width="3" stroke-linejoin="round"
        stroke-linecap="round"/>

  <!-- Snow caps -->
  <path d="M100 52 L114 83 L86 83 Z" fill="rgba(255,255,255,0.65)"/>
  <path d="M38 90 L44 103 L32 103 Z"  fill="rgba(255,255,255,0.3)"/>
  <path d="M162 90 L168 103 L156 103 Z" fill="rgba(255,255,255,0.3)"/>

  <!-- Eagle -->
  <ellipse cx="100" cy="36" rx="6.5" ry="4.5" fill="#f0fdf4"/>
  <circle  cx="100" cy="27"  r="5.5" fill="#f0fdf4"/>
  <path d="M104 27 L112 29 L104 31 Z" fill="#f59e0b"/>
  <circle  cx="102" cy="26" r="1.4"  fill="#060d1b"/>
  <!-- Wings -->
  <path d="M93 34 C78 27 60 32 46 42 C58 35 76 34 90 38 Z" fill="#f0fdf4"/>
  <path d="M107 34 C122 27 140 32 154 42 C142 35 124 34 110 38 Z" fill="#f0fdf4"/>
  <!-- Tail -->
  <path d="M100 41 L93 54 L100 51 L107 54 Z" fill="#f0fdf4"/>

  <!-- Stars (Douglas mullets) -->
  <g fill="#22c55e" opacity="0.9">
    <polygon points="32,73 33.8,78.5 39.5,78.5 35,82 36.8,87.5 32,84 27.2,87.5 29,82 24.5,78.5 30.2,78.5"/>
    <polygon points="100,70 101.8,75.5 107.5,75.5 103,79 104.8,84.5 100,81 95.2,84.5 97,79 92.5,75.5 98.2,75.5"/>
    <polygon points="168,73 169.8,78.5 175.5,78.5 171,82 172.8,87.5 168,84 163.2,87.5 165,82 160.5,78.5 166.2,78.5"/>
  </g>

  <!-- Bottom arc -->
  <path d="M26 158 A78 78 0 0 0 174 158"
        fill="none" stroke="rgba(34,197,94,0.25)" stroke-width="1.4"/>

  <!-- SLIABH wordmark -->
  <text x="100" y="175"
        text-anchor="middle"
        font-family="'Georgia', 'Times New Roman', serif"
        font-size="20"
        font-weight="700"
        fill="#22c55e"
        letter-spacing="5">SLIABH</text>
</svg>
