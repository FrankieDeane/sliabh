# Netlify configuration for the Sliabh Expo web build.
# `expo export -p web` produces a static SPA in the `dist` directory.
[build]
  command = "node scripts/gen-sitemap.mjs && node scripts/gen-poi-data.mjs && npx expo export -p web && node scripts/inject-seo.mjs && node scripts/prerender-home.mjs && node scripts/prerender-trails.mjs"
  publish = "dist"
  # Decide whether a build is worth running BEFORE spending build minutes.
  # exit 0 => skip build, exit 1 => run build. See netlify/ignore-build.sh:
  #  - deploy previews / branch deploys are skipped unless the PR has the
  #    "deploy-preview" label (opt-in), saving most preview build minutes;
  #  - production only rebuilds when build-relevant files actually changed.
  ignore = "bash netlify/ignore-build.sh"

[build.environment]
  NODE_VERSION = "20"
  # Supabase — public client config (auth + database). Safe to commit: the anon
  # key is designed to be embedded in the client and is guarded by Row Level
  # Security. The secret service_role key is NEVER put here.
  EXPO_PUBLIC_SUPABASE_URL = "https://pfwazngwcvirdeyamvsd.supabase.co"
  EXPO_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBmd2F6bmd3Y3ZpcmRleWFtdnNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MzM3OTIsImV4cCI6MjA5NjUwOTc5Mn0.BYVJDsEESyEbZLwA-6W1-GDgYx4Q5ODmHrOeNwzJFD0"

[functions]
  directory = "netlify/functions"

# Gate every request on non-production deploys (deploy previews + branch
# deploys) behind a 401 to stop bots from burning bandwidth. Runs before the
# SPA redirect below, so the real content is never served on those contexts.
# Production is unaffected. See netlify/edge-functions/block-previews.ts.
[[edge_functions]]
  path = "/*"
  function = "block-previews"

# Security headers, sent on every response. Kept conservative (no CSP yet —
# the app pulls scripts/tiles from several CDNs and a wrong CSP would break
# maps in production; add one later after a careful per-origin audit).
# X-Frame-Options is SAMEORIGIN, not DENY: /parques.html is embedded in an
# <iframe> by /rutas and /mapas (the 3D map), so DENY breaks the map — it
# blocks ALL framing, even from our own pages. SAMEORIGIN still blocks
# third-party sites from framing us (the anti-clickjacking goal).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=()"

# Static files Google (and other crawlers/tools) fetch directly and expect
# as real XML/plain text — never as the app shell. Netlify is supposed to
# prefer an existing file in the publish dir over a redirect rule even
# without `force`, but Search Console was reporting "Couldn't fetch" on
# sitemap.xml (it was resolving to the SPA's index.html instead), so these
# are pinned explicitly rather than relying on that default precedence.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

# expo-router with output:"single" emits a single-page app, so every route
# must fall back to index.html for client-side routing to work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
