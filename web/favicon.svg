<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" shape-rendering="geometricPrecision">
  <!-- Background disc -->
  <circle cx="100" cy="100" r="100" fill="#060d1b"/>

  <!-- Green ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#16a34a" stroke-width="5"/>

  <!-- Mountain silhouette fill -->
  <path d="M18 152 L50 86 L74 112 L100 54 L126 112 L150 86 L182 152 Z"
        fill="#0a1e12"/>

  <!-- Mountain outline -->
  <path d="M18 152 L50 86 L74 112 L100 54 L126 112 L150 86 L182 152"
