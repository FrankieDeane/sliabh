<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Outer rough stamp ring -->
  <circle cx="100" cy="100" r="96" fill="#fff" stroke="#1a1a1a" stroke-width="6"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="4 3"/>

  <!-- Mountain peaks -->
  <!-- Left peak -->
  <polygon points="28,148 62,82 80,108" fill="#1a1a1a"/>
  <!-- Middle peak (tallest) -->
  <polygon points="62,148 100,52 138,148" fill="#1a1a1a"/>
  <!-- Right peak -->
  <polygon points="120,108 138,82 172,148" fill="#1a1a1a"/>
  <!-- Snow cap on center peak -->
  <polygon points="100,52 112,80 88,80" fill="#fff"/>
  <!-- Base fill connecting peaks -->
  <rect x="28" y="140" width="144" height="16" fill="#1a1a1a"/>

  <!-- SLIABH text curved at top -->
  <path id="topArc" d="M 28,100 A 72,72 0 0 1 172,100" fill="none"/>
  <text font-family="'Georgia', 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#1a1a1a" letter-spacing="8">
    <textPath href="#topArc" startOffset="12%">SLIABH</textPath>
  </text>

  <!-- Stars / decorative dots -->
  <circle cx="55" cy="68" r="3" fill="#1a1a1a"/>
  <circle cx="100" cy="44" r="3" fill="#1a1a1a"/>
  <circle cx="145" cy="68" r="3" fill="#1a1a1a"/>
</svg>
