<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Sliabh favicon (SVG — mountain + eagle) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fallback PNG for browsers without SVG favicon support -->
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- PWA / theme -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sliabh" />

    <!-- SEO -->
    <title>Sliabh — Explora la montaña</title>
    <meta name="description" content="Explora la montaña con IA offline. Rutas, mapas y planificación para Patagonia y toda Argentina. Un proyecto del clan Douglas, rama Drysdale." />

    <!-- Open Graph -->
    <meta property="og:title" content="Sliabh — Explora la montaña" />
    <meta property="og:description" content="Rutas, mapas y asistente IA offline para Patagonia y Argentina." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Sliabh" />
    <meta name="twitter:description" content="Explora la montaña con IA offline." />

    <!-- Global styles: prevent scrollbar flash, set base bg -->
    <style>
      html, body, #root { height: 100%; margin: 0; padding: 0; }
      body { background-color: #060d1b; overflow-x: hidden; }
      /* Smooth scrollbar on desktop */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #070b14; }
      ::-webkit-scrollbar-thumb { background: #1e2d42; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #16a34a; }
    </style>
  </head>
  <body>
    <noscript>
      <p style="color:#f0fdf4;font-family:sans-serif;padding:40px;text-align:center">
        Sliabh requiere JavaScript para funcionar.
      </p>
    </noscript>
    <%- rootTag %>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
