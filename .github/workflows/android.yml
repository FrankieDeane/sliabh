# Build the Android app from GitHub — the thing a browser cannot do.
#
# Recording with the screen off needs a foreground service, and a foreground
# service needs a real app. This produces one: press "Run workflow" on the
# Actions tab and an installable APK comes out the other end, roughly twenty
# minutes later, attached to the run.
#
# No Expo account, no EAS queue, no Play Store. The build runs entirely on the
# GitHub runner. Releases (android-v* tags) are signed with Sliabh's private
# key from the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets, and
# refuse to build without it; the same key every time, so each new APK
# installs over the previous one. Other builds fall back to the template's
# public key, which is fine for proving the app compiles and nothing else.

name: Android APK

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'What is this build for? (shows up in the run name)'
        required: false
        default: 'prueba en el cerro'
  push:
    tags:
      - 'android-v*'
    # Every merge to the default branch, so the APK is known to build at all
    # times rather than only when someone happens to press the button. Four
    # separate incompatible packages got in while nothing was checking, and
    # each was found the hard way — twenty minutes into a build someone needed.
    branches:
      - sliabh-index
  # Anything that can break the native build is built on the pull request that
  # changes it, so a broken APK is found here and not the first time someone
  # presses the button. Ordinary PRs do not pay the twenty minutes.
  pull_request:
    paths:
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'eas.json'
      - '.github/workflows/android.yml'
      - 'src/services/backgroundTrack*'
      - 'src/services/liveTrack.ts'

run-name: 'Android APK — ${{ inputs.note || github.ref_name }}'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      # The app's own guarantees, checked before anything is shipped to a
      # phone. The offline suite needs the web export, so it runs here too.
      # Seconds, and it catches the class of failure that otherwise shows up
      # two minutes into Gradle as a missing plugin: an Expo package from the
      # wrong SDK, which the web bundle happily ignores.
      - name: Check the Expo packages match the SDK
        run: npm run check:sdk

      - name: Check the sun almanac
        run: npm run validate:solar

      - name: Check elevation and pace
        run: npm run validate:track

      - name: Generate the Android project
        # android/ is not in the repo: app.json is the source of truth, so the
        # project is regenerated here and cannot drift from it.
        run: npx expo prebuild -p android --no-install

      # Needs the generated project, since prebuild is what writes the flag.
      # A module that can only compile with the New Architecture on fails four
      # minutes into Gradle with "cannot find symbol" on a class nobody wrote.
      - name: Check nothing requires the New Architecture
        run: npm run check:newarch

      - name: Confirm the foreground service survived the merge
        # If this ever stops matching, recording with the screen off is gone
        # and nothing else in the build would say so.
        run: |
          set -e
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' "$MANIFEST"
          grep -q 'android.permission.FOREGROUND_SERVICE_LOCATION' "$MANIFEST"
          echo "background location + foreground service permissions present"

      # A release is installed by the public, so it is signed with Sliabh's own
      # private key. The template's key is public: anyone could sign an APK
      # with it that Android would accept as an update to this app. Other
      # builds only prove the app compiles and may use the template key.
      - name: Load the release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sliabh-release.keystore"
            {
              echo "SIGNING_ARGS<<EOF"
              echo "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/sliabh-release.keystore"
              echo "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD"
              echo "-Pandroid.injected.signing.key.alias=sliabh"
              echo "-Pandroid.injected.signing.key.password=$KEYSTORE_PASSWORD"
              echo "EOF"
            } >> "$GITHUB_ENV"
            echo "signing with the Sliabh release key"
          elif [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD are not set. A public release must not ship signed with the template's public key."
            exit 1
          else
            echo "no release key configured; this build uses the template key and is not for distribution"
          fi

      - name: Build the APK
        working-directory: android
        # The template asks for 2 GB, which is tight for a Hermes release
        # build and shows up as a Gradle daemon killed with no useful error.
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" $SIGNING_ARGS

      - name: Confirm the APK carries the release key
        if: env.SIGNING_ARGS != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          want=$(keytool -list -keystore "$RUNNER_TEMP/sliabh-release.keystore" -storepass "$KEYSTORE_PASSWORD" -alias sliabh -v \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: *//; s/://g' | tr 'A-F' 'a-f')
          got=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'SHA-256 digest' | sed 's/.*: *//')
          echo "expected $want"; echo "signed   $got"
          [ -n "$want" ] && [ "$want" = "$got" ]

      - name: Name it after the commit
        id: name
        run: |
          SHA=$(git rev-parse --short HEAD)
          cp android/app/build/outputs/apk/release/app-release.apk "sliabh-${SHA}.apk"
          # Same file under a fixed name, so /app can link to
          # releases/latest/download/sliabh.apk and download in one tap.
          cp "sliabh-${SHA}.apk" sliabh.apk
          echo "apk=sliabh-${SHA}.apk" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          ls -lh "sliabh-${SHA}.apk"

      - name: Attach it to this run
        uses: actions/upload-artifact@v4
        with:
          name: sliabh-android-apk
          path: ${{ steps.name.outputs.apk }}
          retention-days: 30

      # A tag also publishes a Release, so the APK has a permanent link that
      # can be opened straight from a phone instead of a zip behind a login.
      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.name.outputs.apk }}
            sliabh.apk
          name: Sliabh Android ${{ github.ref_name }}
          body: |
            APK instalable de Sliabh (commit `${{ steps.name.outputs.sha }}`).

            **Instalar:** abrí este link desde el teléfono, tocá el `.apk` y
            aceptá "instalar de orígenes desconocidos" si lo pide.

            **Al iniciar la primera caminata, elegí "Permitir siempre"** en el
            permiso de ubicación. Sin eso Android corta la grabación al apagar
            la pantalla — que es justo lo que esta app viene a arreglar.
