name: tests

# The offline guarantees are the kind that fail silently — a service worker
# that never registers throws nothing. These run on every pull request so a
# regression is caught here rather than on a mountain.
on:
  pull_request:
  push:
    branches: [sliabh-index]

jobs:
  offline-and-solar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Public client config, same values the site builds with (see
      # netlify.toml). The anon key is designed to be embedded in the client
      # and is guarded by row-level security.
      EXPO_PUBLIC_SUPABASE_URL: https://pfwazngwcvirdeyamvsd.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBmd2F6bmd3Y3ZpcmRleWFtdnNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MzM3OTIsImV4cCI6MjA5NjUwOTc5Mn0.BYVJDsEESyEbZLwA-6W1-GDgYx4Q5ODmHrOeNwzJFD0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 for `node --experimental-strip-types`, which the solar
          # validation uses to import the TypeScript engine directly.
          node-version: 22
          cache: npm

      - run: npm ci

      # A package from the wrong Expo SDK passes the web build and breaks the
      # native one, so it is caught here rather than in Gradle.
      - name: Expo packages match the SDK
        run: npm run check:sdk

      - name: Solar almanac vs SunCalc
        run: npm run validate:solar

      # An inflated climb is worse than none: a hiker plans a day around it.
      - name: Elevation and pace against known profiles
        run: npm run validate:track

      # A suggested route is planned around: it must take the sensible way,
      # leave out trails harder than asked, and never invent a connection.
      - name: Offline route suggestions
        run: npm run validate:routing

      # The public MCP server (sliabh.com.ar/mcp): every tool annotated,
      # answering with valid input and failing clearly with invalid input.
      - name: MCP server
        run: npm run test:mcp

      - name: Error reporting filters
        run: npm run test:errors

      - name: Build the web bundle
        run: npx expo export -p web

      # Lo que Netlify publica para que la app se actualice sola: si esto no
      # arma, los teléfonos se quedan sin mejoras sin que nadie lo note.
      - name: App auto-update files
        run: |
          node scripts/build-app-updates.mjs --out "$RUNNER_TEMP/upd" --strict
          for p in android ios; do
            f=$(ls "$RUNNER_TEMP/upd/app-updates/$p/"*.json)
            node -e "const m=require('$f');for(const k of ['id','createdAt','runtimeVersion','launchAsset'])if(!m[k])throw new Error(k);console.log('$p',m.runtimeVersion,m.assets.length,'assets')"
          done

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # El mapa offline: lo guardado con 💾 se lee al reabrir la app y no queda
      # en blanco al acercar de más.
      - name: Offline map tiles
        run: npm run test:offline-tiles

      - name: Offline and recording guarantees
        run: npm run test:offline
